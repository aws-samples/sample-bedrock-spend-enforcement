AWSTemplateFormatVersion: '2010-09-09'
Description: >
  DynamoDB tables for Bedrock spend enforcement: per-user spend state
  (StateTable) and manually-managed spend-limit exceptions (ExceptionsTable).

Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    # checkov:skip=CKV_AWS_119:Uses DynamoDB default encryption at rest; a customer-managed KMS CMK is out of scope for this single-account reference sample.
    # checkov:skip=CKV_AWS_28:Per-user daily spend state resets at the 0400 UTC boundary and is re-derivable from Bedrock logs; point-in-time recovery is out of scope for this sample.
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit table name is referenced by the Lambda environment variables and across stacks; the no-in-place-replacement tradeoff is acceptable for this reference sample."
          - id: W74
            reason: "Uses DynamoDB default encryption at rest; a customer-managed KMS CMK is out of scope for this single-account reference sample."
          - id: W78
            reason: "Per-user daily spend state resets each day and is re-derivable from Bedrock logs; point-in-time recovery is out of scope for this sample."
    Properties:
      TableName: bedrock-spend-enforcement-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  ExceptionsTable:
    Type: AWS::DynamoDB::Table
    # checkov:skip=CKV_AWS_119:Uses DynamoDB default encryption at rest; a customer-managed KMS CMK is out of scope for this single-account reference sample.
    # checkov:skip=CKV_AWS_28:Exceptions are manually created via the Slack admin command and easily re-created; point-in-time recovery is out of scope for this sample.
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit table name is referenced by the Lambda environment variables and across stacks; the no-in-place-replacement tradeoff is acceptable for this reference sample."
          - id: W74
            reason: "Uses DynamoDB default encryption at rest; a customer-managed KMS CMK is out of scope for this single-account reference sample."
          - id: W78
            reason: "Exceptions are manually created and easily re-created; point-in-time recovery is out of scope for this sample."
    Properties:
      TableName: bedrock-spend-enforcement-exceptions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

Outputs:
  StateTableArn:
    Value: !GetAtt StateTable.Arn
    Description: Pass this ARN as a parameter to the lambda stack (StateDynamoTableArn)
  ExceptionsTableArn:
    Value: !GetAtt ExceptionsTable.Arn
    Description: Pass this ARN as a parameter to the lambda stack (ExceptionsDynamoTableArn)
